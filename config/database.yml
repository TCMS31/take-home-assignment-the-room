# Database configuration.
#
# The app targets PostgreSQL (Docker, staging, production). Local development
# and the test suite default to SQLite so the project can be cloned and run
# with no database server installed.
#
# Set DATABASE_ADAPTER=postgresql to use PostgreSQL; every connection detail is
# then read from the environment. No credential is ever committed to this file.

<% postgres = ENV.fetch('DATABASE_ADAPTER', 'sqlite3') == 'postgresql' %>

default: &default
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>
<% if postgres %>
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch('DATABASE_HOST', 'localhost') %>
  port: <%= ENV.fetch('DATABASE_PORT', 5432) %>
  username: <%= ENV.fetch('DATABASE_USERNAME', 'postgres') %>
  password: <%= ENV.fetch('DATABASE_PASSWORD', '') %>
<% else %>
  adapter: sqlite3
  timeout: 5000
<% end %>

development:
  <<: *default
<% if postgres %>
  database: <%= ENV.fetch('DATABASE_NAME', 'take_home_development') %>
<% else %>
  database: storage/development.sqlite3
<% end %>

test:
  <<: *default
<% if postgres %>
  database: <%= ENV.fetch('DATABASE_NAME', 'take_home_test') %>
<% else %>
  database: storage/test.sqlite3
<% end %>

production:
  <<: *default
<% if postgres %>
  database: <%= ENV.fetch('DATABASE_NAME', 'take_home_production') %>
<% else %>
  database: storage/production.sqlite3
<% end %>
