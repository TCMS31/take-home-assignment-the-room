services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-take_home_development}
      POSTGRES_USER: ${DATABASE_USERNAME:-take_home}
      # Required: no default, so the stack cannot start on a known password.
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-take_home}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_ADAPTER: postgresql
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-take_home_development}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-take_home}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      DUMMY_JSON_BASE_DOMAIN: ${DUMMY_JSON_BASE_DOMAIN:-https://dummyjson.com}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
